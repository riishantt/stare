[project]
name = "stare"
version = "0.1.0"
description = "STARE: a multi-agent AI system for verified US employment-law research"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "eyecite>=2.6",
    "pymupdf>=1.24",
    "pytesseract>=0.3",
    "pillow>=10",
    "python-docx>=1.1",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "httpx>=0.27",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "python-multipart>=0.0.9",
    "rapidfuzz>=3.9",
    "sse-starlette>=2.1",
    "typer>=0.12",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
]

[project.optional-dependencies]
# Hosted LLM providers. Never called unless STARE_LLM_PROVIDER is set to one of them.
llm = ["anthropic>=1.0", "openai>=1.40"]
# Microsoft Presidio PII detection (falls back to the built-in regex redactor if absent).
presidio = ["presidio-analyzer>=2.2", "presidio-anonymizer>=2.2", "spacy>=3.7"]
# Production database: PostgreSQL 16 + pgvector.
postgres = ["psycopg[binary]>=3.1", "pgvector>=0.3", "langgraph-checkpoint-postgres>=2.0"]
# Neural embeddings / cross-encoder reranker (heavy: downloads model weights).
neural = ["fastembed>=0.3", "sentence-transformers>=3.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
stare = "stare.cli:app"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["stare*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "network: test needs internet access to free public endpoints (deselect with -m 'not network')",
]

[tool.ruff]
line-length = 110
target-version = "py312"
