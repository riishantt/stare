<div class="content">
<p>Not later than 1 year after <span class="date" date="1990-07-26">July 26, 1990</span>, the<a aria-label="Definitions -  Commission " class="colorbox-load definedterm" href="/definitions/uscode.php?width=840&amp;height=800&amp;iframe=true&amp;def_id=42-USC-1283237621-717135117&amp;term_occur=999&amp;term_src=title:42:chapter:126:subchapter:I:section:12116"> Commission </a>shall issue regulations in an accessible format to carry out this subchapter in accordance with subchapter II of chapter 5 of title 5.</p>
</div>
<div class="sourceCredit">(<a href="/rio/citation/Pub._L._101-336">Pub. L. 101–336, title I, § 106</a>, <span class="date" date="1990-07-26">July 26, 1990</span>, <a href="/rio/citation/104_Stat._336">104 Stat. 336</a>.)</div>
